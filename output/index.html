<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Mes cours – Correction IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121212; --surface:#1d1d1f; --surface-2:#26262a; --surface-3:#303036;
  --line:#3a3a42; --text:#e8e8ec; --text-2:#a9a9b3; --text-3:#7a7a85;
  --primary:#448aff; --primary-soft:rgba(68,138,255,.14); --accent:#1de9b6; --ex:#69f0ae; --gold:#e8c547;
  --radius:10px; --appbar:64px;
  --shadow-1:0 1px 3px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4); --shadow-2:0 4px 12px rgba(0,0,0,.55);
  --font:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.appbar{position:sticky;top:0;height:var(--appbar);z-index:20;display:flex;align-items:center;gap:16px;padding:0 24px;
  background:linear-gradient(90deg,#1a237e 0%,#283593 45%,#1d1d1f 100%);box-shadow:var(--shadow-2)}
.brand{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0}
.brand b{font-weight:500;font-size:19px}
.brand small{color:rgba(255,255,255,.65);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.search{width:min(320px,45vw);background:rgba(255,255,255,.1);border:1px solid transparent;border-radius:20px;color:#fff;
  font:400 14px var(--font);padding:8px 16px;outline:none;transition:border-color .15s,background .15s}
.search::placeholder{color:rgba(255,255,255,.55)}
.search:focus{border-color:var(--accent);background:rgba(255,255,255,.14)}
main{max-width:1200px;margin:0 auto;padding:32px 24px 80px}
.hero h1{font-weight:300;font-size:36px;line-height:1.2}
.stats{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0 32px}
.stat{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-1);padding:14px 22px;min-width:150px}
.stat b{display:block;font-size:28px;font-weight:300;color:#fff;line-height:1.1}
.stat small{color:var(--text-3);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-1);border-top:3px solid var(--primary);
  padding:20px 22px;display:flex;flex-direction:column;gap:14px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.card-top{display:flex;gap:14px;align-items:flex-start}
.card h2{font-weight:400;font-size:19px;line-height:1.3;flex:1}
.note{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1;
  background:linear-gradient(135deg,#283593,#1a237e);color:#fff;font-size:18px;font-weight:500}
.note small{display:block;font-size:10px;color:rgba(255,255,255,.65);font-weight:400;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{font-size:12px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:3px 10px}
.links{display:flex;gap:8px;margin-top:auto}
.links a{flex:1;text-align:center;font:500 12px var(--font);letter-spacing:.06em;text-transform:uppercase;padding:8px 6px;border-radius:18px;
  border:1px solid var(--line);color:var(--text-2);transition:background .15s,color .15s,border-color .15s}
.links a:hover{background:var(--primary-soft);color:#fff;border-color:var(--primary)}
.links a.main{background:var(--primary);border-color:var(--primary);color:#fff}
.links a.main:hover{filter:brightness(1.15)}
.empty{color:var(--text-3);padding:40px 0;text-align:center}
@media (max-width:600px){ .brand small{display:none} .hero h1{font-size:28px} }
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><b>Mes cours</b><small>Correction IA · Hub</small></div>
  <input class="search" id="q" type="search" placeholder="Rechercher un cours…" aria-label="Rechercher un cours">
</header>
<main>
  <div class="hero"><h1>Tous les cours corrigés</h1></div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
</main>
<script>
const COURS = [{"titre":"VMware vSphere – ESXi et vCenter","note":"15,5","date":"05/11/2026","heure":"17h23","themes":8,"quiz":54,"fichier":"COURS_CORRECTION_IA_05112026_1723.html"},{"titre":"Virtualisation – Proxmox VE","note":"14,5","date":"05/11/2026","heure":"09h08","themes":9,"quiz":0,"fichier":"COURS_CORRECTION_IA_05112026_0908.html"}];
(() => {
  const grid = document.getElementById('grid'), q = document.getElementById('q'), stats = document.getElementById('stats');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = n => parseFloat(String(n).replace(',', '.'));
  const notes = COURS.map(c => num(c.note)).filter(n => !isNaN(n));
  const moy = notes.length ? (notes.reduce((a, b) => a + b, 0) / notes.length).toFixed(1).replace('.', ',') : '–';
  const nbQuiz = COURS.reduce((a, c) => a + (+c.quiz || 0), 0);
  stats.innerHTML = `<div class="stat"><b>${COURS.length}</b><small>cours</small></div>`
    + `<div class="stat"><b>${moy}</b><small>moyenne /20</small></div>`
    + `<div class="stat"><b>${nbQuiz}</b><small>questions de quiz</small></div>`;
  function render() {
    const f = q.value.trim().toLowerCase();
    const list = COURS.filter(c => !f || c.titre.toLowerCase().includes(f));
    grid.innerHTML = list.length ? list.map(c => `
      <article class="card">
        <div class="card-top"><h2>${esc(c.titre)}</h2>${c.note ? `<div class="note"><div>${esc(c.note)}<small>/20</small></div></div>` : ''}</div>
        <div class="meta"><span>${esc(c.date)}${c.heure ? ' · ' + esc(c.heure) : ''}</span>${c.themes ? `<span>${c.themes} thèmes</span>` : ''}${+c.quiz ? `<span>${c.quiz} questions</span>` : ''}</div>
        <div class="links">
          <a class="main" href="${esc(c.fichier)}">Cours</a>
          ${+c.quiz ? `<a href="${esc(c.fichier)}#q-1">Quiz</a>` : ''}
          <a href="${esc(c.fichier)}#e-1">Bilan</a>
        </div>
      </article>`).join('') : '<p class="empty">Aucun cours ne correspond.</p>';
  }
  q.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
